name: Apache AGE storage smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/apache-age-smoke.yml'
      - 'code-graph-app/**'
      - 'code-graph-core/**'
      - 'code-graph-model/**'
      - 'code-graph-storage-apache-age/**'
      - 'code-graph-storage-memory/**'
      - 'code-graph-storage-neo4j/**'
      - 'code-graph-spring-boot-starter/**'
      - 'pom.xml'
  push:
    branches: [master]
    paths:
      - '.github/workflows/apache-age-smoke.yml'
      - 'code-graph-app/**'
      - 'code-graph-core/**'
      - 'code-graph-model/**'
      - 'code-graph-storage-apache-age/**'
      - 'code-graph-storage-memory/**'
      - 'code-graph-storage-neo4j/**'
      - 'code-graph-spring-boot-starter/**'
      - 'pom.xml'

permissions:
  contents: read

jobs:
  app-health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      age:
        image: apache/age:latest
        env:
          POSTGRES_PASSWORD: age-password
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build app
        run: mvn -B -pl code-graph-app -am -DskipTests package

      - name: Start app against AGE and check health
        env:
          CODEGRAPH_STORAGE_TYPE: apache-age
          CODEGRAPH_DATABASE_URL: jdbc:postgresql://127.0.0.1:15432/postgres
          CODEGRAPH_DATABASE_USERNAME: postgres
          CODEGRAPH_DATABASE_PASSWORD: age-password
          CODEGRAPH_DATABASE_DRIVER: org.postgresql.Driver
          CODEGRAPH_DATABASE_SCHEMA: classpath:db/schema-postgresql.sql
          CODEGRAPH_TASKS_ENABLED: 'false'
          CODEGRAPH_MCP_ENABLED: 'false'
          CODEGRAPH_MASTER_KEY: age-smoke-master-key
        run: |
          set -euo pipefail
          java -jar code-graph-app/target/code-graph-app-0.0.1-SNAPSHOT.jar --server.port=18085 >"$RUNNER_TEMP/age-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/age-app.log"' EXIT
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:18085/api/code-graph/health-check; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/age-app.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/age-app.log"
          exit 1
