name: Release self-contained parser-java CLI

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['parser-java-v*']
    paths: ['packaging/parser-java/**', '.github/workflows/release-parser-java.yml', 'code-graph-parser-java-jdt/**', 'code-graph-model/**', 'code-graph-spi/**', 'pom.xml']

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out static extractor dependency
        uses: actions/checkout@v7
        with:
          repository: praha-poseidon/static-extract-java
          path: static-extract-java
      - name: Check out shared SER specification
        uses: actions/checkout@v7
        with:
          repository: praha-poseidon/static-extract-spec
          path: static-extract-spec
      - run: |
          mv static-extract-java ../static-extract-java
          mv static-extract-spec ../static-extract-spec
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./packaging/parser-java/build-linux-x64.sh "${GITHUB_REF_NAME:-dev}"
      - name: Smoke test bundled JRE
        run: |
          package_dir="$(find target/release -maxdepth 1 -type d -name 'parser-java-*' | head -n 1)"
          "$package_dir/bin/parser-java" --help
          "$package_dir/runtime/bin/java" -version
      - uses: actions/upload-artifact@v7
        with:
          name: parser-java-linux-x64
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
